<style>
        :root {
            --primary: #3b82f6; --primary-hover: #2563eb; --primary-light: #eff6ff; --primary-border: #bfdbfe;
            --purple: #8b5cf6; --purple-hover: #7c3aed; --purple-light: #f5f3ff; --purple-border: #ede9fe;
            --danger: #ef4444; --danger-hover: #dc2626; --danger-light: #fef2f2;
            --bg-body: #f8fafc; --bg-surface: #ffffff; --bg-panel: #f1f5f9;
            --text-main: #0f172a; --text-muted: #64748b; --text-light: #94a3b8;
            --border-color: #e2e8f0; --border-dark: #cbd5e1;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-2xl: 1.25rem;
            --radius-pill: 9999px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        button { background: none; border: none; cursor: pointer; font-family: inherit; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        input, select, textarea { font-family: inherit; }
        .hidden { display: none !important; }

        /* Layout Structure */
        .preview-section { height: 220px; position: sticky; top: 0; flex-shrink: 0; display: flex; flex-direction: column; background-color: var(--bg-surface); z-index: 50; }
        .canvas-wrapper { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; pointer-events: none; border-bottom: 1px solid var(--border-color); }
        .main-canvas { display: block; filter: drop-shadow(0 25px 25px rgba(0,0,0,0.15)); transition: transform 0.2s ease; }
        .editor-section { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-body); z-index: 20; }
        
        .tabs-nav {
            display: flex;
            overflow-x: auto; 
            padding: 0.4rem 1rem; 
            background-color: var(--bg-surface); 
            flex-shrink: 0;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            border-bottom: 1px solid var(--border-color);
        }
        @media (max-width: 768px) {
            .tabs-nav { justify-content: flex-start; }
        }
        
        .tab-btn { 
            position: relative; white-space: nowrap; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            padding: 0.5rem 1rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem; 
            font-size: 0.8rem; border-radius: var(--radius-pill); font-weight: 600; border: 1px solid transparent;
        }
        .tab-btn:hover { color: var(--text-main); background-color: var(--bg-panel); }
        .tab-btn.active { color: var(--bg-surface); background-color: var(--text-main); box-shadow: var(--shadow-sm); }
        
        /* Custom Colors for Tabs */
        .tab-btn.purple-tab { color: var(--purple); }
        .tab-btn.purple-tab:hover { background-color: var(--purple-light); }
        .tab-btn.purple-tab.active { background-color: var(--purple); color: var(--bg-surface); }
        
        .tab-btn.export-tab { color: var(--primary); }
        .tab-btn.export-tab:hover { background-color: var(--primary-light); }
        .tab-btn.export-tab.active { background-color: var(--primary); color: var(--bg-surface); }
        
        @media (max-width: 639px) { .tab-btn span { display: none; } .tab-btn { padding: 0.5rem 1rem; } }
        
        /* Content Area */
        .content-area { flex: 1; overflow-y: auto; padding: 1rem; padding-bottom: 2rem; max-width: 52rem; margin: 0 auto; width: 100%; }
        .panel-content { display: none; animation: slideUp 0.3s ease-out forwards; opacity: 0; transform: translateY(10px); }
        .panel-content.active { display: block; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* Typography & Utilities */
        .text-center { text-align: center; } .text-sm { font-size: 0.875rem; } .text-xs { font-size: 0.75rem; } 
        .text-lg { font-size: 1rem; } .text-xl { font-size: 1.125rem; } .text-4xl { font-size: 1.75rem; }
        .font-bold { font-weight: 700; } .font-semibold { font-weight: 600; } .font-medium { font-weight: 500; } 
        .font-mono { font-family: monospace; } .uppercase { text-transform: uppercase; } 
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .text-muted { color: var(--text-muted); } .text-primary { color: var(--primary); } 
        .text-purple { color: var(--purple); } .text-danger { color: var(--danger); }
        
        /* Flex & Grid Utilities - Compressed Gaps & Margins */
        .flex { display: flex; } .flex-col { flex-direction: column; } .flex-wrap { flex-wrap: wrap; }
        .items-center { align-items: center; } .justify-center { justify-content: center; } .justify-between { justify-content: space-between; }
        .flex-1 { flex: 1; } .gap-2 { gap: 0.25rem; } .gap-3 { gap: 0.5rem; } .gap-4 { gap: 0.75rem; } .gap-5 { gap: 1rem; }
        .w-full { width: 100%; } .h-full { height: 100%; }
        .mb-2 { margin-bottom: 0.25rem; } .mb-3 { margin-bottom: 0.5rem; } .mb-4 { margin-bottom: 0.75rem; } 
        .mb-5 { margin-bottom: 1rem; } .mb-6 { margin-bottom: 1.25rem; } .mt-1 { margin-top: 0.25rem; } 
        .mt-2 { margin-top: 0.5rem; } .mt-3 { margin-top: 0.75rem; } .mt-4 { margin-top: 1rem; } .mt-6 { margin-top: 1.25rem; }
        .ml-1 { margin-left: 0.25rem; } .ml-2 { margin-left: 0.5rem; } .mr-2 { margin-right: 0.5rem; } .mr-3 { margin-right: 0.75rem; }
        
        .grid { display: grid; }
        .grid-cols-2 { grid-template-columns: repeat(2, 1fr); } .grid-cols-3 { grid-template-columns: repeat(3, 1fr); } .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
        @media (min-width: 640px) {
            .sm-grid-cols-2 { grid-template-columns: repeat(2, 1fr); } .sm-grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
            .sm-grid-cols-4 { grid-template-columns: repeat(4, 1fr); } .sm-grid-cols-6 { grid-template-columns: repeat(6, 1fr); }
            .sm-flex-row { flex-direction: row; } .sm-flex-none { flex: none; } .sm-w-auto { width: auto; } .sm-text-left { text-align: left; }
        }

        /* Modern Form Inputs - Slimmer */
        .input-label { display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.4rem; letter-spacing: 0.05em; }
        .input-label.block { display: block; }
        .input-label span:last-child { color: var(--text-main); font-weight: 800; }
        .input-label span.highlight { color: var(--primary); }
        
        .form-input { 
            width: 100%; background-color: var(--bg-surface); border: 2px solid var(--border-color); 
            border-radius: var(--radius-md); padding: 0.5rem 0.75rem; font-size: 0.875rem; color: var(--text-main); 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--shadow-sm); 
        }
        .form-input:hover { border-color: var(--border-dark); }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
        textarea.form-input { resize: vertical; font-weight: 700; min-height: 60px; max-height: 120px; line-height: 1.3; }
        
        /* Premium Sliders */
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: var(--bg-panel); border-radius: var(--radius-pill); border: 1px solid var(--border-color); outline: none; transition: background 0.2s; }
        input[type="range"]:focus { border-color: var(--primary-border); }
        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; 
            background: var(--bg-surface); border: 2px solid var(--primary); cursor: pointer; 
            box-shadow: var(--shadow-md); transition: transform 0.15s, background 0.2s; 
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); background: var(--primary-light); }
        input[type="range"]::-webkit-slider-thumb:active { transform: scale(0.95); background: var(--primary); border-color: var(--bg-surface); }
        
        input[type="color"] { -webkit-appearance: none; border: none; width: 36px; height: 36px; border-radius: var(--radius-md); cursor: pointer; padding: 0; background: none; box-shadow: var(--shadow-sm); transition: transform 0.2s; }
        input[type="color"]:hover { transform: scale(1.05); }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid var(--border-color); border-radius: var(--radius-md); }
        
        /* Modern Toggle Switch */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-dark); transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 50%; box-shadow: var(--shadow-sm); }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* Boxes & Cards */
        .box { background: var(--bg-surface); padding: 1rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .box:hover { box-shadow: var(--shadow-md); }
        .box-sm { padding: 0.75rem; }

            const c = parseInt(h, 16);

            const rgb1 = hexToRgb(c1);
            const rgb2 = hexToRgb(c2);
            const r = Math.round(rgb1[0] + factor * (rgb2[0] - rgb1[0]));
            const g = Math.round(rgb1[1] + factor * (rgb2[1] - rgb1[1]));

        function getPaintStyle(targetCtx, styleDef, boxW, boxH, centerX, centerY) {
            if (styleDef.type === 'solid') return styleDef.color || '#000';
            if (['gradient', 'radial'].includes(styleDef.type) && styleDef.stops && styleDef.stops.length >= 2) {
                const radius = Math.max(boxW, boxH) / 1.5; 
                let grad;
                if (styleDef.type === 'radial') {
                    grad = targetCtx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
                } else {
                    let gradAngle = styleDef.angleGrad !== undefined ? styleDef.angleGrad : (styleDef.angle !== undefined ? styleDef.angle : 90);
                    const angleRad = (gradAngle - 90) * Math.PI / 180;
                    const x0 = centerX - Math.cos(angleRad) * radius; const y0 = centerY - Math.sin(angleRad) * radius;
                    const x1 = centerX + Math.cos(angleRad) * radius; const y1 = centerY + Math.sin(angleRad) * radius;
                    grad = targetCtx.createLinearGradient(x0, y0, x1, y1);
                }
                const sortedStops = [...styleDef.stops].sort((a,b)=>a.pos - b.pos);
                sortedStops.forEach(s => grad.addColorStop(s.pos / 100, s.color));
                return grad;
            }
            if (styleDef.type === 'pattern' && styleDef.patternImage) {
                const pat = targetCtx.createPattern(styleDef.patternImage, 'repeat');
                if (pat && styleDef.patternSize !== undefined && styleDef.patternSize !== 100) {
                    const scale = styleDef.patternSize / 100;
                    const matrix = new DOMMatrix().scale(scale, scale);
                    pat.setTransform(matrix);
                }
                return pat || '#000';
            }
            return styleDef.color || '#000';

                        drawTextLayer(op.x, op.y, 'stroke', {type:'solid', color:'#000000', opacity: 1}, {width: op.style.size * 2, opacity: 1}, spreadCtx, fullLinesData, currentState);
                    }

                    let tempCanvas = document.createElement('canvas'); tempCanvas.width = w; tempCanvas.height = h;
                    let tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
                    tempCtx.shadowColor = '#000000';
                    tempCtx.shadowBlur = op.style.blur * fitScale;
                    tempCtx.shadowOffsetX = op.style.offsetX * fitScale;
                    tempCtx.shadowOffsetY = op.style.offsetY * fitScale;
                    tempCtx.drawImage(holeCanvasSpread, 0, 0);

                    tempCtx.globalCompositeOperation = 'destination-out';
                    tempCtx.drawImage(holeCanvas, 0, 0); // Erase from exact original border
                    tempCtx.globalCompositeOperation = 'destination-in';
                    tempCtx.drawImage(maskCanvas, 0, 0); // Intersect with base bounds

                    let colorCanvas = document.createElement('canvas'); colorCanvas.width = w; colorCanvas.height = h;
                    let colorCtx = colorCanvas.getContext('2d');
                    colorCtx.font = getFontString(currentState);
                    colorCtx.textBaseline = 'middle'; colorCtx.lineJoin = 'round'; colorCtx.lineCap = 'round'; colorCtx.miterLimit = 2;
                    colorCtx.translate(w / 2, h / 2); colorCtx.scale(fitScale, fitScale); colorCtx.translate(gX, gY);
                    if (currentState.rotation || gRot) colorCtx.rotate((currentState.rotation * Math.PI / 180) + gRot);
                    if (gScaleX !== 1 || gScaleY !== 1) colorCtx.scale(gScaleX, gScaleY);
                    drawTextLayer(op.x, op.y, 'fill', op.style, {opacity:1}, colorCtx, fullLinesData, currentState);

                    colorCtx.setTransform(1,0,0,1,0,0);
                    colorCtx.globalCompositeOperation = 'destination-in';
                    colorCtx.drawImage(tempCanvas, 0, 0);

                    tCtx.save();
                    tCtx.setTransform(1,0,0,1,0,0);
                    tCtx.globalAlpha = op.style.opacity !== undefined ? op.style.opacity : 1;
                    tCtx.drawImage(colorCanvas, 0, 0);
                    tCtx.restore();
                }
                else if (op.type === 'shadow') {
                    let sBlur = op.style.blur;
                    if (currentState.animation.id === 'neon_flicker') sBlur *= (0.5 + Math.random());

                    let tempCanvas = document.createElement('canvas');
                    tempCanvas.width = w; tempCanvas.height = h;
                    let tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

                    tempCtx.font = getFontString(currentState);
                    tempCtx.textBaseline = 'middle';
                    tempCtx.lineJoin = 'round';
                    tempCtx.lineCap = 'round';
                    tempCtx.miterLimit = 2;

                    tempCtx.translate(w / 2, h / 2);
                    tempCtx.scale(fitScale, fitScale);
                    tempCtx.translate(gX, gY);
                    if (currentState.rotation || gRot) tempCtx.rotate((currentState.rotation * Math.PI / 180) + gRot);
                    if (gScaleX !== 1 || gScaleY !== 1) tempCtx.scale(gScaleX, gScaleY);

                    const sx = op.x + op.style.offsetX;
                    const sy = op.y + op.style.offsetY;

                    if (op.thickness > 0 || (op.style.size && op.style.size > 0)) {
                        drawTextLayer(sx, sy, 'stroke', op.style, { width: op.thickness + (op.style.size || 0) * 2, opacity: 1 }, tempCtx, fullLinesData, currentState);
                    }
                    drawTextLayer(sx, sy, 'fill', op.style, { opacity: 1 }, tempCtx, fullLinesData, currentState);

                    tCtx.save();
                    tCtx.setTransform(1, 0, 0, 1, 0, 0);
                    tCtx.filter = `blur(${sBlur * fitScale}px)`;
                    tCtx.globalAlpha = op.style.opacity !== undefined ? op.style.opacity : 0.5;
                    tCtx.drawImage(tempCanvas, 0, 0);
                    tCtx.restore();
                }
            }
            tCtx.restore();

            targetCtx.clearRect(0, 0, w, h);

            if (!exportCtx || currentState.bg.type !== 'transparent') {
                targetCtx.save();
                targetCtx.globalAlpha = currentState.bg.opacity !== undefined ? currentState.bg.opacity : 1;
                if (['solid', 'gradient', 'radial', 'pattern'].includes(currentState.bg.type)) {
                    if (currentState.bg.type === 'pattern' && currentState.bg.patternBgType && currentState.bg.patternBgType !== 'none') {
                        const bgBgStyle = {
                            type: currentState.bg.patternBgType,
                            color: currentState.bg.patternBgColor,
                            angleGrad: currentState.bg.patternBgAngle,
                            stops: currentState.bg.patternBgStops
                        };
                        targetCtx.fillStyle = getPaintStyle(targetCtx, bgBgStyle, w, h, w/2, h/2);
                        targetCtx.fillRect(0, 0, w, h);
                    }
                    targetCtx.fillStyle = getPaintStyle(targetCtx, currentState.bg, w, h, w/2, h/2);
                    targetCtx.fillRect(0, 0, w, h);
                } else if (currentState.bg.type === 'image' && currentState.bg.image) {
                    const img = currentState.bg.image;
                    const mode = currentState.bg.imageMode || 'stretch';
                    if (mode === 'original') {
                        targetCtx.drawImage(img, (w - img.width)/2, (h - img.height)/2);
                    } else if (mode === 'cover' || mode === 'contain') {
                        const scale = (mode === 'cover') ? Math.max(w/img.width, h/img.height) : Math.min(w/img.width, h/img.height);
                        const sw = img.width * scale;
                        const sh = img.height * scale;
                        targetCtx.drawImage(img, (w - sw)/2, (h - sh)/2, sw, sh);
                    } else {
                        targetCtx.drawImage(img, 0, 0, w, h);
                    }
                }
                targetCtx.restore();
            } else if (exportCtx && currentState.bg.type === 'transparent' && isGifExport) {
                // Background relies on canvas clear (0,0,0,0). Will be mapped via threshold in exportGIF loop to avoid edge artifacts.
            }

            if(isStrobing) return;

            targetCtx.save();
            if(hueShift !== 0) targetCtx.filter = `hue-rotate(${hueShift}deg)`;
            
            targetCtx.drawImage(textCanvas, 0, 0);
            targetCtx.restore();
        }

        function upgradeAlternatingState(obj) {
            if(obj && obj.type === 'alternating') {
                if(!obj.altMode) obj.altMode = 'solid';
                if(!obj.altScope) obj.altScope = 'letter';
                
                if(!obj.altGradients) {
                    obj.altGradients = [
                        {angle: 90, stops: [{color: '#ff0000', pos: 0}, {color: '#ffea00', pos: 100}]},
                        {angle: 90, stops: [{color: '#00f0ff', pos: 0}, {color: '#0000ff', pos: 100}]}
                    ];
                } else {
                    obj.altGradients.forEach(g => {
                        if(g.c1 && !g.stops) {
                            g.stops = [{color: g.c1, pos: 0}, {color: g.c2, pos: 100}];
                            delete g.c1;
                            delete g.c2;
                        }
                    });
                }
                if(!obj.colors) obj.colors = ['#ff0000', '#3b82f6'];
                if(!obj.altImages) obj.altImages = [];
            }
        }

                    stateObj.scope = 'text';
                }

                if (isMainFill && stateObj.scope === 'extruded') {
                    stateObj.scope = 'text';

        async function restoreStateImages(loadedState) {
            if (loadedState.strokes || loadedState.depth || loadedState.shadows) {
                loadedState.layers = [];
                if (loadedState.strokes) {
                    loadedState.strokes.forEach(s => loadedState.layers.push({ ...s, layerType: 'stroke', opacity: 1 }));
                }
                if (loadedState.depth && loadedState.depth.enabled) {
                    loadedState.layers.push({ ...loadedState.depth, layerType: '3d', opacity: 1 });
                }
                if (loadedState.shadows) {
                    loadedState.shadows.forEach(sh => {
                        let c = sh.color || '#000000', op = 0.5;
                        if(c.startsWith('rgba')) {
                            const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
                            if(m) {
                                c = "#" + (1 << 24 | m[1] << 16 | m[2] << 8 | m[3]).toString(16).slice(1);
                                op = m[4] !== undefined ? parseFloat(m[4]) : 1;
                            }
                        }
                        loadedState.layers.push({ ...sh, layerType: 'shadow', type: 'solid', color: c, opacity: op, size: 0 });
                    });
                }
                delete loadedState.strokes;
                delete loadedState.depth;
                delete loadedState.shadows;
            }

            state = { ...defaultState, ...loadedState }; 

            if (isImageTextMode) {
                state.layers = [];
            }

            const restoreImg = async (obj, keyBase64, keyImg) => {
                if (obj && obj[keyBase64]) {
                    return new Promise(resolve => {
                        const img = new Image();
                        img.crossOrigin = "Anonymous";
                        img.onload = () => { obj[keyImg] = img; resolve(); };
                        img.onerror = () => resolve(); 
                        img.src = obj[keyBase64];
                    });
                }
            };

            const promises = [];
            promises.push(restoreImg(state.bg, 'base64', 'image'));
            promises.push(restoreImg(state.fill, 'patternBase64', 'patternImage'));
            
            // Restore alternating patterns images
            if(state.fill.altImages) {
                state.fill.altImages.forEach(imgObj => promises.push(restoreImg(imgObj, 'base64', 'image')));
            }
            
            if(state.layers) {
                state.layers.forEach(layer => {
                    promises.push(restoreImg(layer, 'patternBase64', 'patternImage'));
                    if(layer.altImages) {
                        layer.altImages.forEach(imgObj => promises.push(restoreImg(imgObj, 'base64', 'image')));
                    }
                });
            }
            
            await Promise.all(promises);
        }

        function saveProjectJSON() {
            const exportData = JSON.stringify(state, (key, val) => {
                if (key === 'patternImage' || key === 'image') return undefined; 
                return val;
            });
            const blob = new Blob([exportData], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = `EXCPIX_Project_${Date.now()}.json`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            URL.revokeObjectURL(url);
        }

        async function loadProjectJSON(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const loadedState = JSON.parse(event.target.result);
                    await restoreStateImages(loadedState);
                    updateUIFromState();
                    requestRender();
                } catch(err) {
                    console.error("Failed to load state", err);
                }
                e.target.value = ''; 
            };
            reader.readAsText(file);
        }

        function generateAnimations() {

                btn.addEventListener('click', () => {

                });

            });

        function exportImage(quality, ratioString) {
            const btn = document.getElementById('btn-download');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating Masterpiece...';
            btn.disabled = true;
            
            setTimeout(() => {
                try {
                    const dCanvas = document.createElement('canvas'); const dCtx = dCanvas.getContext('2d', { willReadFrequently: true }); dCtx.font = getFontString(state);
                    const lines = state.text.split('\n'); let maxW = 0; 
                    lines.forEach(line => { 
                        let sumCharW = 0; 
                        for(let char of line) {
                            if (isImageTextMode && /^[a-zA-Z0-9]$/.test(char)) {
                                const img = getCharImage(char);
                                if (img) sumCharW += img.width * (BASE_FONT_SIZE / img.height);
                                else sumCharW += BASE_FONT_SIZE * 0.8;
                            } else {
                                sumCharW += dCtx.measureText(char).width;
                            }
                        }
                        maxW = Math.max(maxW, sumCharW + (Math.max(0, line.length - 1) * state.letterSpacing)); 
                    }); 
                    const totalH = lines.length * (BASE_FONT_SIZE * state.lineHeight);
                    
                    let maxStrokeW = 0, cX = 0, cY = 0;
                    let maxShadowEx = 0, sumWrapW = 0;
                    state.layers.forEach(layer => {
                        if(!layer.enabled) return;
                        if(layer.layerType === 'stroke') maxStrokeW = Math.max(maxStrokeW, layer.width || 0);
                        else if(layer.layerType === '3d') {
                            maxStrokeW = Math.max(maxStrokeW, layer.width || 0);
                            cX += layer.size * Math.cos(layer.angle * Math.PI / 180);
                            cY += layer.size * Math.sin(layer.angle * Math.PI / 180);
                        }
                        else if(layer.layerType === 'shadow') {
                            maxShadowEx = Math.max(maxShadowEx, layer.blur + Math.abs(layer.offsetX) + Math.abs(layer.offsetY) + (layer.size || 0));
                        }
                        else if(layer.layerType === 'outer_wrap') {
                            sumWrapW += (layer.width || 0);
                        }
                    });

                    let pad = 20 + maxStrokeW + Math.abs(cX) + Math.abs(cY) + maxShadowEx + sumWrapW; 
                    pad += Math.abs(state.curve || 0) + Math.abs(state.zigzag || 0) + Math.abs(state.wave || 0);
                    
                    const contentW = maxW + pad * 2; const contentH = totalH + pad * 2;
                    
                    const targetDims = getTargetDimensionsForRatio(contentW, contentH, ratioString);
                    let targetW = targetDims.w; let targetH = targetDims.h;
                    
                    if (isImageTextMode) {
                        let originalImgHeight = 800;
                        for (let key in charImageCache) {
                            if (charImageCache[key] && charImageCache[key].height) {
                                originalImgHeight = charImageCache[key].height;
                                break;
                            }
                        }
                        const baseScale = originalImgHeight / BASE_FONT_SIZE;
                        
                        if (quality === 'original') {
                            targetW *= baseScale; targetH *= baseScale;
                        } else if (quality === '50%') {
                            targetW *= baseScale * 0.5; targetH *= baseScale * 0.5;
                        } else if (quality === '20%') {
                            targetW *= baseScale * 0.2; targetH *= baseScale * 0.2;
                        }
                    } else {
                        if (quality === 'HD') { const s = 1024 / Math.max(targetW, targetH); targetW *= s; targetH *= s; } 
                        else if (quality === '4K') { const s = 3840 / Math.max(targetW, targetH); targetW *= s; targetH *= s; } 
                        else if (quality === '8K') { const s = 7680 / Math.max(targetW, targetH); targetW *= s; targetH *= s; } 
                        else if (quality === 'MAX') { const s = 10000 / Math.max(targetW, targetH); targetW *= s; targetH *= s; } 
                    }
                    
                    const eCanvas = document.createElement('canvas'); eCanvas.width = targetW; eCanvas.height = targetH; const eCtx = eCanvas.getContext('2d', { willReadFrequently: true }); 
                    const exportScale = targetW / targetDims.w;
                    
                    render(state, eCtx, targetW, targetH, exportScale, undefined, false);
                    
                    eCanvas.toBlob((blob) => {
                        if (blob) {
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a'); 
                            link.download = `EXCPIX-${quality}-${Date.now()}.png`; 
                            link.href = url; 
                            
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            
                            setTimeout(() => URL.revokeObjectURL(url), 1000); 
                        }
                        
                        btn.innerHTML = '<i class="fa-solid fa-download"></i> Download PNG'; 
                        btn.disabled = false;
                    }, 'image/png');

                } catch(e) { 
                    console.error(e);
                    btn.innerHTML = '<i class="fa-solid fa-download"></i> Download PNG'; 
                    btn.disabled = false;
                } 
            }, 100);
        }

        async function exportGIF(quality, ratioString) {
            const btn = document.getElementById('btn-download');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating GIF Loop...';
            btn.disabled = true;
            try {
                const workerRes = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
                const workerBlob = await workerRes.blob();
                const workerUrl = URL.createObjectURL(workerBlob);
                
                const isTransparent = state.bg.type === 'transparent';
                
                // --- PROFESSIONAL GIF GLITCH FIX ---
                // Optimized hardware concurrency for dramatically faster rendering speed 
                // Increased quality integer to 10 for fastest speed while retaining visual fidelity

                });
                
                const dCanvas = document.createElement('canvas'); const dCtx = dCanvas.getContext('2d', { willReadFrequently: true }); dCtx.font = getFontString(state);

                            if (img) sumCharW += img.width * (BASE_FONT_SIZE / img.height);
                            else sumCharW += BASE_FONT_SIZE * 0.8;
                        } else {
                            sumCharW += dCtx.measureText(char).width;
                        }
                    }
                    maxW = Math.max(maxW, sumCharW + (Math.max(0, line.length - 1) * state.letterSpacing)); 
                }); 
                const totalH = lines.length * (BASE_FONT_SIZE * state.lineHeight);
                
                let maxStrokeW = 0, cX = 0, cY = 0;
                let maxShadowEx = 0, sumWrapW = 0;
                state.layers.forEach(layer => {
                    if(!layer.enabled) return;
                    if(layer.layerType === 'stroke') maxStrokeW = Math.max(maxStrokeW, layer.width || 0);
                    else if(layer.layerType === '3d') {
                        maxStrokeW = Math.max(maxStrokeW, layer.width || 0);
                        cX += layer.size * Math.cos(layer.angle * Math.PI / 180);
                        cY += layer.size * Math.sin(layer.angle * Math.PI / 180);
                    }
                    else if(layer.layerType === 'shadow') {
                        maxShadowEx = Math.max(maxShadowEx, layer.blur + Math.abs(layer.offsetX) + Math.abs(layer.offsetY) + (layer.size || 0));
                    }
                    else if(layer.layerType === 'outer_wrap') {
                        sumWrapW += (layer.width || 0);
                    }
                });

                let pad = 20 + maxStrokeW + Math.abs(cX) + Math.abs(cY) + maxShadowEx + sumWrapW; 
                pad += Math.abs(state.curve || 0) + Math.abs(state.zigzag || 0) + Math.abs(state.wave || 0);
                pad += 100; 
                
                const contentW = maxW + pad * 2; const contentH = totalH + pad * 2;
                
                const targetDims = getTargetDimensionsForRatio(contentW, contentH, ratioString);
                let targetW = targetDims.w; let targetH = targetDims.h;

                if (isImageTextMode) {
                    let originalImgHeight = 800;
                    for (let key in charImageCache) {
                        if (charImageCache[key] && charImageCache[key].height) {
                            originalImgHeight = charImageCache[key].height;
                            break;
                        }
                    }
                    const baseScale = originalImgHeight / BASE_FONT_SIZE;
                    
                    if (quality === 'original') {
                        targetW *= baseScale; targetH *= baseScale;
                    } else if (quality === '50%') {
                        targetW *= baseScale * 0.5; targetH *= baseScale * 0.5;
                    } else if (quality === '10%') {
                        targetW *= baseScale * 0.2; targetH *= baseScale * 0.2;
                    }
                } else {
                    if (quality === 'HD') { const s = 800 / Math.max(targetW, targetH); targetW *= s; targetH *= s; } 
                    else if (quality === '4K') { const s = 2560 / Math.max(targetW, targetH); targetW *= s; targetH *= s; }
                    else if (quality === '8K') { const s = 3840 / Math.max(targetW, targetH); targetW *= s; targetH *= s; }
                    else if (quality === 'MAX') { const s = 5000 / Math.max(targetW, targetH); targetW *= s; targetH *= s; } 
                }
                
                const exportScale = targetW / targetDims.w;
                const duration = 2000 / state.animation.speed;
                const fps = 20; 
                const totalFrames = Math.round((duration / 1000) * fps);
                
                for (let i = 0; i < totalFrames; i++) {
                    const t = i / totalFrames;
                    const frameCanvas = document.createElement('canvas'); frameCanvas.width = targetW; frameCanvas.height = targetH;
                    const fCtx = frameCanvas.getContext('2d', {willReadFrequently: true});
                    
                    render(state, fCtx, targetW, targetH, exportScale, t, true);

                    if (isTransparent) {
                        const imgData = fCtx.getImageData(0, 0, targetW, targetH);
                        const data = imgData.data;
                        for (let j = 0; j < data.length; j += 4) {
                            // Professional Transparency Alpha Fix
                            if (data[j + 3] < 128) { // Strict Alpha Threshold
                                data[j] = 0; data[j + 1] = 254; data[j + 2] = 1; data[j + 3] = 255;
                            } else { 
                                // Prevent glitch colors merging with semi-transparent pixels
                                data[j + 3] = 255; // Force opacity for clean anti-alias edges
                                // Ensure standard colors don't accidentally match chroma key
                                if (data[j] === 0 && data[j + 1] === 254 && data[j + 2] === 1) data[j + 2] = 2; 
                            }
                        }
                        fCtx.putImageData(imgData, 0, 0);
                    }
                    
                    gif.addFrame(frameCanvas, {delay: 1000/fps, copy: true});
                    
                    // Fixed massive rendering bottleneck by replacing setTimeout(10) with native requestAnimationFrame handling
                    if(i % 5 === 0) {
                        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Rendering Frame ${i}/${totalFrames}...`;
                        await new Promise(r => requestAnimationFrame(r)); 
                    }

                    URL.revokeObjectURL(workerUrl);
                });

                btn.innerHTML = '<i class="fa-solid fa-film"></i> Download GIF';
                btn.disabled = false;
            }
